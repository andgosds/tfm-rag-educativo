[project]
name = "tfm-rag-evaluation"
version = "0.1.0"
description = "Isolated RAG generation and RAGAS evaluation environment for the TFM"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ragas==0.4.3",
    "langchain-community>=0.3,<0.4",
    "langchain-ollama>=1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]
