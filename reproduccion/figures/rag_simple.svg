<text x="28" y="193" font-size="20" font-weight="bold">Respuesta a una consulta</text>
<g fill="none" stroke="#45576a" stroke-width="2" marker-end="url(#arrow)">
<path d="M228 95 H298"/><path d="M528 95 H608"/><path d="M725 131 V237 H528"/>
