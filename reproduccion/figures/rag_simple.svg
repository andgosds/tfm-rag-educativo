<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500">
<title>Flujo básico de un sistema RAG</title>
<desc>Preparación: corpus, segmentación e índice. Consulta: pregunta y búsqueda en el índice; los fragmentos recuperados, la pregunta y las instrucciones llegan al modelo generativo, que produce la respuesta.</desc>
