<g text-anchor="middle" font-size="19">
<text x="128" y="101">Corpus documental</text>
<text x="413" y="89">Segmentación</text><text x="413" y="114" font-size="16">Fragmentos de texto</text>
<text x="725" y="89">Índice</text><text x="725" y="114" font-size="16">Fragmentos consultables</text>
